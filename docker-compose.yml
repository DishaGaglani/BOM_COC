services:
  backend:
    build: ./backend
    environment:
      BOMCOC_STORAGE_DIR: /app/storage
      # Uncomment to require an API key on /api/* and /documents/* routes.
      # Must match the frontend's VITE_API_KEY below.
      # BOMCOC_API_KEY: change-me
      # Origins allowed by CORS, as a JSON array; defaults to
      # ["http://localhost:5173"] if unset.
      # BOMCOC_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
      # Uncomment and set to match the backend's BOMCOC_API_KEY above.
      # VITE_API_KEY: change-me
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:

# Postgres and Ollama services were removed with the old backend during the
# unstructured.io parsing rewrite. Persistence is SQLite now (backend/storage/
# bomcoc.db, inside the ./backend bind mount above — no separate service
# needed). Re-add Ollama once the parsed-output -> Gemma pipeline is built.
