services:
  backend:
    build: ./backend
    environment:
      BOMCOC_STORAGE_DIR: /app/storage
      # Uncomment to require an API key on /api/* and /documents/* routes.
      # Must match the frontend's VITE_API_KEY below.
      # BOMCOC_API_KEY: change-me
      # Origins allowed by CORS, as a JSON array; defaults to
      # ["http://localhost:5173"] if unset.
      # BOMCOC_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      # forjinn.com-hosted flow (Qwen agent) for semantic field extraction
      # and COC-vs-BOM comparison — see app/services/forjinn_client.py.
      # Unset to disable extraction entirely (BOM/COC ingestion will raise).
      BOMCOC_FORJINN_API_URL: https://forjinn.com/api/v1/prediction/23715a87-e685-4ed3-9f07-98aeb705233a
      # Uncomment if forjinn's endpoint ends up requiring an API key —
      # unconfirmed as of writing (see forjinn_client.py's module docstring).
      # BOMCOC_FORJINN_API_KEY: change-me
      BOMCOC_FORJINN_TIMEOUT_SECONDS: 180
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
      # Uncomment and set to match the backend's BOMCOC_API_KEY above.
      # VITE_API_KEY: change-me
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:

# Persistence is SQLite for BOMs/COCs (backend/storage/bomcoc.db). Semantic
# extraction/validation calls out to forjinn.com (see BOMCOC_FORJINN_API_URL
# above) rather than running a local model, so there's no model volume here.
